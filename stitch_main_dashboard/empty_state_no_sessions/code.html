<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#059467",
                        "background-light": "#f5f8f7",
                        "background-dark": "#0f231d",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .pool-table-surface {
            background-color: #059467;
            background-image: radial-gradient(circle at center, #06a875 0%, #059467 100%);
        }

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">

</div>

</div>

<div class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-primary/10 transition-colors cursor-pointer text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined text-[20px]">dashboard</span>
<span class="text-sm font-semibold">Dashboard</span>
</div>
<div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-primary/10 text-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined text-[20px] fill-1">table_bar</span>
<span class="text-sm font-semibold">Tables</span>
</div>
<div class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-primary/10 transition-colors cursor-pointer text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined text-[20px]">group</span>
<span class="text-sm font-semibold">Customers</span>
</div>
</div>
<div class="flex gap-2">
<button class="flex size-10 items-center justify-center rounded-xl bg-primary/10 text-primary hover:bg-primary/20 transition-all">

</button>

<span class="material-symbols-outlined">settings</span>
</button>
</div>

</div>

<div class="size-4 bg-slate-100 rounded-full shadow-sm"></div>

<div class="size-4 bg-slate-100 rounded-full shadow-sm"></div>

</div>
</div>
</div>
<div class="absolute top-1/2 right-[25%] -translate-y-1/2 size-5 bg-white rounded-full shadow-md border border-slate-200"></div>
</div>
</div>
<div class="flex flex-col items-center text-center space-y-4 max-w-lg">
<div class="inline-flex items-center px-3 py-1 rounded-full bg-primary/10 text-primary text-xs font-bold uppercase tracking-wider">
                            System Idle
                        </div>
<h1 class="text-3xl font-extrabold text-slate-900 dark:text-slate-100 tracking-tight">
                            No sessions running right now
                        </h1>
<p class="text-lg text-slate-600 dark:text-slate-400 font-medium leading-relaxed">

                        </p>
</div>
<div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
<button class="flex-1 max-w-[240px] flex items-center justify-center gap-2 h-14 bg-primary text-white rounded-xl font-bold text-base shadow-lg shadow-primary/25 hover:brightness-110 active:scale-95 transition-all">
<span class="material-symbols-outlined">map</span>

                        </button>
<button class="flex-1 max-w-[240px] flex items-center justify-center gap-2 h-14 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-xl font-bold text-base hover:bg-slate-50 dark:hover:bg-slate-700 active:scale-95 transition-all shadow-sm">
<span class="material-symbols-outlined">edit_note</span>
