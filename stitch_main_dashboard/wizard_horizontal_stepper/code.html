<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Store Creation Wizard - Pool Hall SaaS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#059467",
                        "background-light": "#f5f8f7",
                        "background-dark": "#0f231d",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100 font-display">
<div class="layout-container flex h-full grow flex-col">
<!-- Header / Navigation -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-primary/10 px-6 md:px-10 py-4 bg-white dark:bg-slate-900 shadow-sm">
<div class="flex items-center gap-3 text-primary">
<div class="size-8">
<svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 11.2727C44 14.0109 39.8386 16.3957 33.69 17.6364C39.8386 18.877 44 21.2618 44 24C44 26.7382 39.8386 29.123 33.69 30.3636C39.8386 31.6043 44 33.9891 44 36.7273C44 40.7439 35.0457 44 24 44C12.9543 44 4 40.7439 4 36.7273C4 33.9891 8.16144 31.6043 14.31 30.3636C8.16144 29.123 4 26.7382 4 24C4 21.2618 8.16144 18.877 14.31 17.6364C8.16144 16.3957 4 14.0109 4 11.2727C4 7.25611 12.9543 4 24 4C35.0457 4 44 7.25611 44 11.2727Z"></path>
</svg>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight">RackMaster</h2>
</div>
<div class="flex flex-1 justify-end items-center gap-4">
<span class="text-sm font-medium text-slate-500 dark:text-slate-400 hidden md:block">Setup Progress</span>
<div class="bg-primary/10 rounded-full p-1">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-8" data-alt="User profile avatar of the account owner" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuC_fyxDz1ot5SETihv2-Et0JJ8JkgzLAnX2tTI3aC910thvikJq17OsXqxAw7Ct-Zg_ybe21WPpMmdtNLQMVKzfhyLs7jdJHqxUCGEYioJ5KEd5kod9gZicGPC2FunU5nr1Y8w_UKghFCHAsbR4anVcQi94x8UPJsqbYZ27PYIDmbPjnVyJTz41iG3E2Y82opwbQHP28KlqVBhBXbWfvvdrare6YXdBPRSd5q6aoHIG7SRA39CLLIBW7L_mgLmx1X-jNJSJF7iteHtR");'></div>
</div>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center p-4 md:p-10">
<div class="w-full max-w-[640px] bg-white dark:bg-slate-900 rounded-xl shadow-xl overflow-hidden border border-primary/5">
<!-- Stepper Progress Header -->
<div class="p-6 md:p-8 bg-slate-50 dark:bg-slate-800/50 border-b border-primary/5">
<div class="flex flex-wrap justify-between items-end gap-3 mb-6">
<div class="flex flex-col gap-1">
<h1 class="text-slate-900 dark:text-slate-100 text-2xl font-bold leading-tight">Store Creation Wizard</h1>
<p class="text-primary font-medium text-sm">Step 2: Owner Information</p>
</div>
<div class="text-right">
<span class="text-slate-900 dark:text-slate-100 text-sm font-bold">Step 2 of 3</span>
</div>
</div>
<!-- Horizontal Progress Bar -->
<div class="relative w-full h-2 bg-primary/10 rounded-full overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary transition-all duration-500" style="width: 66%;"></div>
</div>
<div class="flex justify-between mt-2 text-[10px] uppercase tracking-widest font-bold text-slate-400 dark:text-slate-500">
<span>Details</span>
<span class="text-primary">Owner</span>
<span>Tables</span>
</div>
</div>
<!-- Form Content -->
<div class="p-6 md:p-8 space-y-6">
<div class="flex items-center gap-4 mb-2">
<div class="size-12 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-3xl">person_edit</span>
</div>
<div>
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-bold">Owner Details</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm">Provide the primary contact information for this venue.</p>
</div>
</div>
<div class="space-y-4">
<!-- Input Field: Full Name -->
<div class="group flex flex-col gap-2 p-4 rounded-lg bg-primary/5 border border-primary/10 focus-within:border-primary/40 focus-within:bg-white dark:focus-within:bg-slate-800 transition-all">
<label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400" for="full-name">Full Name</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/60">person</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-slate-900 dark:text-slate-100 placeholder:text-slate-300" id="full-name" placeholder="Johnathan Doe" type="text"/>
</div>
</div>
<!-- Input Field: Email Address -->
<div class="group flex flex-col gap-2 p-4 rounded-lg bg-primary/5 border border-primary/10 focus-within:border-primary/40 focus-within:bg-white dark:focus-within:bg-slate-800 transition-all">
<label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400" for="email">Email Address</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/60">mail</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-slate-900 dark:text-slate-100 placeholder:text-slate-300" id="email" placeholder="owner@poolhall.com" type="email"/>
</div>
</div>
<!-- Input Field: Phone Number -->
<div class="group flex flex-col gap-2 p-4 rounded-lg bg-primary/5 border border-primary/10 focus-within:border-primary/40 focus-within:bg-white dark:focus-within:bg-slate-800 transition-all">
<label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400" for="phone">Phone Number</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/60">call</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-slate-900 dark:text-slate-100 placeholder:text-slate-300" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-4 pt-4">
<button class="flex-1 order-2 sm:order-1 px-6 py-3 rounded-lg border border-primary/20 text-primary font-bold hover:bg-primary/5 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">arrow_back</span>
                            Back
                        </button>
<button class="flex-[2] order-1 sm:order-2 px-6 py-3 rounded-lg bg-primary text-white font-bold hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
                            Continue to Tables
                            <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</div>
<!-- Footer Tip -->
<div class="px-8 py-4 bg-slate-50 dark:bg-slate-800/30 text-center border-t border-primary/5">
<p class="text-slate-400 dark:text-slate-500 text-xs flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">lock</span>
                        Your information is encrypted and securely stored.
                    </p>
</div>
</div>
</main>
<!-- Aesthetic background decorations -->
<div class="fixed top-0 left-0 -z-10 w-full h-full opacity-30 pointer-events-none">
<div class="absolute top-[10%] left-[5%] w-64 h-64 bg-primary/10 blur-3xl rounded-full"></div>
<div class="absolute bottom-[10%] right-[5%] w-96 h-96 bg-primary/5 blur-3xl rounded-full"></div>
</div>
</div>
</body></html>
